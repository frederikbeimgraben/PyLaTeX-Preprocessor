name: Release

# Pushing a version tag (e.g. `v0.2.0`) runs the full CI gate, builds the
# distributions stamped with the tag's version, publishes them to PyPI and
# creates a GitHub Release.
on:
  push:
    tags: ["v*"]

jobs:
  # Reuse the CI workflow so a release can never ship code that fails checks.
  gate:
    uses: ./.github/workflows/ci.yml

  build:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Stamp version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Building version $VERSION"
          python - "$VERSION" <<'PY'
          import re, sys, pathlib
          version = sys.argv[1]
          path = pathlib.Path("pyproject.toml")
          text = path.read_text()
          text, n = re.subn(
              r'^version = ".*"$', f'version = "{version}"', text, count=1, flags=re.M
          )
          assert n == 1, "could not find a version line to stamp"
          path.write_text(text)
          PY

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Check artifacts
        run: |
          python -m pip install twine
          twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # OIDC token for PyPI trusted publishing
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # Trusted publishing: configure this repo as a publisher on PyPI
      # (https://docs.pypi.org/trusted-publishers/). No API token needed.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
