# Extra Python packages that the standalone `pytex` binary bundles.
#
# The binary runs a document file and a `pytex(...)` marker in its own frozen
# interpreter. That interpreter cannot see the site-packages of the user. So
# this file must list every package that a document imports.
#
# `requirements` holds the pip names. The build installs them into the build
# environment. `collect` holds the import names that PyInstaller collects in
# full through `collect_all`. The two names differ for some packages. Pillow
# imports as PIL, PyYAML imports as yaml, and python-calamine imports as
# python_calamine.

[bundle]
requirements = [
  "numpy",
  "pandas",
  "openpyxl",        # read/write .xlsx
  "python-calamine", # fast .xlsx, .xls and .ods reader, pandas engine="calamine"
  "Pillow",          # images
  "PyYAML",          # .yaml and .yml data
  "tabulate",        # quick tables from data
]

collect = [
  "numpy",
  "pandas",
  "openpyxl",
  "python_calamine",
  "PIL",
  "yaml",
  "tabulate",
]
