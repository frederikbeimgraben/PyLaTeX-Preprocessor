[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pytex-preprocessor"
version = "1.0.6"
authors = [
  { name="Frederik Beimgraben", email="frederik@beimgraben.net" },
]
description = "Type-safe LaTeX document generation with Python"
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }
classifiers = [
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
]
dependencies = ["pydantic", "marko"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "basedpyright"]

[project.scripts]
pytex = "pytex_builder.build:main"
pytex-tex2py = "pytex_builder.tex2py:main"
pytex-sandbox-init = "pytex_api.sandbox_init:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pytex_hsrtreport = ["assets/**/*", "tex/**/*"]

[tool.pyright]
extraPaths = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 88
target-version = "py313"
src = ["src", "tests"]
# `test_template.py` uses Python 3.14 t-string syntax, which the py313 target
# cannot parse. Ruff skips the file. Pytest still runs it on Python 3.14.
# CI lints `src` and `tests` only, so `examples/` stays outside the lint scope.
# The exclusion keeps a bare `ruff check` equal to CI. Some example files also
# use 3.14 t-strings.
extend-exclude = ["tests/pytex/test_template.py", "examples"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "N",    # pep8-naming
  "UP",   # pyupgrade
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "SIM",  # flake8-simplify
  "RET",  # flake8-return
  "PIE",  # flake8-pie
  "TC",   # flake8-type-checking
  "ANN",  # flake8-annotations
  "RUF",  # ruff-specific
]
# The public API mirrors LaTeX control sequences as PascalCase factories, for
# example `Bfseries`, `Author` and `Align`. N802 flags those names, so this
# config ignores it. A rename breaks every document and downstream package.
ignore = ["N802"]

[tool.ruff.lint.per-file-ignores]
# Tests prefer readability over full annotation coverage.
"tests/**" = ["ANN"]
# These modules embed raw LaTeX templates. The German typography uses non-ASCII
# glyphs on purpose, for example EN DASH separators and MULTIPLICATION SIGN.
# An inline `noqa` cannot work here, because it lands inside the template
# string. `pagesetup` holds one large raw LaTeX template string. Its lines must
# stay as they are, because a source break changes the emitted LaTeX.
"src/pytex_hsrtreport/pagesetup.py" = ["RUF001", "E501"]
"src/pytex_hsrtreport/watermark.py" = ["RUF002"]
# `glossary` holds raw LaTeX template constants: column types, style and
# labels. These constants pass the line length limit. They must stay on one
# line, because a source break changes the emitted LaTeX.
"src/pytex_hsrtreport/glossary.py" = ["E501"]
# `tectonic` pins a table of biber SHA256 checksums. Each hash is 64 characters
# on one line, and a source break corrupts it.
"src/pytex_builder/tectonic.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["pytex_components", "pytex", "pytex_builder", "pytex_koma", "pytex_tikz", "pytex_hsrtreport", "pytex_markdown"]
